default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  ssl_mode: <%= ENV.fetch("DB_SSL_MODE", "disabled") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "inventory_management_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "inventory_management_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "inventory_management_production") %>
